              - strong [ref=f52e35]: 🛡️ 端到端加密
              - text: ： 使用 AES-256 + ECDH 加密算法，消息仅您和接收者可解密
            - listitem [ref=f52e36]:
              - strong [ref=f52e37]: 🔐 密码增强加密
              - text: ： 房间密码直接参与加密密钥生成，提供额外的安全保护层
            - listitem [ref=f52e38]:
