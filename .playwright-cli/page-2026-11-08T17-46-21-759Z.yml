          - paragraph [ref=f52e17]: Whisper 是一个真正的端到端加密聊天系统。采用无数据库架构，所有消息在您的设备上本地加密，服务器仅作为加密数据的中转站，无法获取您的任何明文内容。
        - generic [ref=f52e18]:
          - heading "🚀 快速开始" [level=3] [ref=f52e19]
          - list [ref=f52e20]:
            - listitem [ref=f52e21]:
              - strong [ref=f52e22]: 输入用户名
              - text: ： 选择一个在房间中显示的昵称，可以是任何您喜欢的名称
            - listitem [ref=f52e23]:
              - strong [ref=f52e24]: 设置房间名
              - text: ： 房间的唯一标识符，相当于房间号
            - listitem [ref=f52e25]:
              - strong [ref=f52e26]: 设置房间密码
              - text: ： 用于区分不同房间，同时参与加密过程，提升安全性
            - listitem [ref=f52e27]:
              - strong [ref=f52e28]: 点击"加入房间"
              - text: ： 系统将自动生成加密密钥，开始安全聊天
          - generic [ref=f52e29]:
            - strong [ref=f52e30]: ⚠️ 重要提示
            - text: ：相同房间名但不同密码的是两个完全独立的房间，无法相互通信。
        - generic [ref=f52e31]:
