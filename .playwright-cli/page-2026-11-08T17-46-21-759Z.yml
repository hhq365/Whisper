              - text: ： 公共记录由在线成员保管，全员离开后仅保留10秒刷新重连窗口。分享房间只接收和保存加入后的消息；分享房间和记录仅包含分享者生成链接时可见的公共记录。
            - listitem [ref=f52e40]:
              - strong [ref=f52e41]: 🎭 完全匿名
              - text: ： 无需注册账户，不收集任何个人信息
            - listitem [ref=f52e42]:
